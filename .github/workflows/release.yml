name: release

# Build every distributable of a release tag from the component repositories.
#
# The product repository is the only place that produces artifacts, so this is
# the only release workflow. It expects a token that can read the component
# repositories (the default GITHUB_TOKEN cannot): create a repository secret
# named COMPONENTS_TOKEN with `contents: read` on localreel-core, localreel-web
# and localreel-format.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (defaults to the tag or Cargo.toml)
        required: false

permissions:
  contents: write
  packages: write

env:
  ORG: LocalReel

jobs:
  version:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: product
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="$(jq -r '.version' product/components.json)"
          fi
          if [[ -z "$version" ]]; then
            echo "cannot determine the version; pass the workflow input" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: windows (${{ needs.version.outputs.version }})
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ORG }}/LocalReel
          token: ${{ secrets.COMPONENTS_TOKEN }}
          path: product
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ORG }}/localreel-core
          token: ${{ secrets.COMPONENTS_TOKEN }}
          path: localreel-core
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ORG }}/localreel-web
          token: ${{ secrets.COMPONENTS_TOKEN }}
          path: localreel-web

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: localreel-web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: localreel-core

      # WiX 5 builds the MSI; the UI extension is required by localreel.wxs.
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2

      - name: Compose zip + MSI
        shell: pwsh
        run: |
          ./product/scripts/compose.ps1 -ComponentsDir "$PWD" -BuildMsi -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            product/dist/localreel-*-x64.zip
            product/dist/localreel-*-x64.msi
          if-no-files-found: error

  linux:
    name: linux (${{ needs.version.outputs.version }})
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ORG }}/LocalReel
          token: ${{ secrets.COMPONENTS_TOKEN }}
          path: product
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ORG }}/localreel-core
          token: ${{ secrets.COMPONENTS_TOKEN }}
          path: localreel-core
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ORG }}/localreel-web
          token: ${{ secrets.COMPONENTS_TOKEN }}
          path: localreel-web

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: localreel-web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: localreel-core

      - name: Build web UI
        working-directory: localreel-web
        run: |
          npm ci
          npm run build

      - name: Tarball + .deb
        working-directory: product
        run: |
          ./scripts/package-linux.sh --skip-build
          ./scripts/package-deb.sh --skip-build

      - name: AppImage
        working-directory: product
        # FUSE is not available on the runner; the script and the image both
        # accept --appimage-extract-and-run.
        run: ./scripts/package-appimage.sh --skip-build

      - name: Smoke test the .deb payload
        run: |
          set -euo pipefail
          deb="$(ls -1 product/dist/localreel_*_amd64.deb | tail -1)"
          dpkg-deb -x "$deb" /tmp/deb
          /tmp/deb/usr/bin/localreel --version
          /tmp/deb/usr/bin/localreel doctor | grep -q "web:       embedded"
          dpkg-deb --info "$deb" | grep -q "Package: localreel"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            product/dist/*.tar.gz
            product/dist/*.tar.gz.sha256
            product/dist/*.deb
            product/dist/*.AppImage
          if-no-files-found: error

  docker:
    name: docker (multi-arch)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ORG }}/localreel-core
          token: ${{ secrets.COMPONENTS_TOKEN }}
          path: localreel-core
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ORG }}/localreel-web
          token: ${{ secrets.COMPONENTS_TOKEN }}
          path: localreel-web

      # arm64 NAS boxes are half the target fleet, so the image is built for
      # both architectures; QEMU makes the arm64 compile possible on an amd64
      # runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        working-directory: localreel-core
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo "$ORG" | tr '[:upper:]' '[:lower:]')/localreel"
          version="${{ needs.version.outputs.version }}"
          docker buildx build \
            --build-context web=../localreel-web \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.source=https://github.com/$ORG/${{ github.event.repository.name }}" \
            --tag "$image:$version" \
            --tag "$image:latest" \
            --push \
            .

  release:
    name: publish
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Checksums
        run: |
          set -euo pipefail
          find artifacts -type f \( -name '*.zip' -o -name '*.msi' -o -name '*.tar.gz' -o -name '*.deb' -o -name '*.AppImage' \) \
            -exec cp {} . \;
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          files: |
            *.zip
            *.msi
            *.tar.gz
            *.deb
            *.AppImage
            SHA256SUMS.txt
          fail_on_unmatched_files: false
