appId: dev.localreel.desktop
productName: LocalReel
copyright: Copyright © LocalReel

# `LocalReel-<version>-arm64.dmg` next to the server's own
# `localreel-<version>-arm64.dmg` is one case-insensitive collision away from
# being the same release asset, which is exactly how the first 0.5.7 publish
# failed: the uploader tried to update an asset that the other file had already
# claimed. "Desktop" in the name makes the two entries unambiguous everywhere —
# release page, checksums file, download page.
artifactName: LocalReel-Desktop-${version}-${arch}.${ext}

# The shell is one window onto a server that ships in the same installer, so the
# first (and for now only) target is an unpacked directory: the WiX installer
# harvests it instead of nesting a second installer inside the first.
directories:
  output: out
  buildResources: build

files:
  - src/**/*
  - package.json
  - README.md

asar: true

# Chromium ships 55 locale packs (~48 MB unpacked) and the app uses two: the
# rest never loads and only makes the installer bigger. This is the one trim
# that costs nothing at runtime — the binary, ICU data and the paks are what
# Chromium actually needs.
electronLanguages:
  - en-US
  - zh-CN

# The server binary is copied here by scripts/compose.ps1 before packaging
# (`<repo>/dist/localreel.exe`). Leaving it out of this file means a desktop-only
# build still works on a machine that has the server on PATH.
extraResources:
  - from: resources/server
    to: server
    filter:
      - "**/*"

win:
  target:
    - target: dir
      arch:
        - x64
  # There is no code-signing certificate, and a self-signed binary would only
  # teach people to click past warnings. `signExecutable: false` skips the
  # signature but keeps rcedit, so the exe still carries the product icon and
  # version resource — without it, Explorer calls the app "Electron".
  signExecutable: false

linux:
  # A distributable shell: the server itself is installed by the .deb/.tar.gz,
  # and the app finds it on PATH when nothing is bundled beside it.
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
  category: AudioVideo

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.video
